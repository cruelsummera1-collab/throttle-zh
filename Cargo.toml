[package]
name = "throttle"
version = "0.1.2"
edition = "2024"
description = "按进程统计的网络流量监控工具（中文极简版，基于 Throttle 改造）"
repository = "https://github.com/FrancescoCoding/Throttle"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
crossbeam-channel = "0.5.16"
eframe = "0.36.2"
egui_extras = "0.36.2"
egui_plot = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windivert = "0.6.0"
windivert-sys = "0.10.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-manifest = "1"
winresource = "0.1.31"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
winrt-toast = "0.1.1"
tray-icon = "0.21"

# 发布构建：压缩 exe 体积与常驻代码页（strip 掉符号表、LTO、单代码
# 生成单元、按体积优化）。panic 保持默认 unwind 而非 abort：后端工作
# 线程的 panic 在设计上只记日志（main.rs 的 panic hook），且 names.rs
# 等处对 Mutex 中毒做了解毒恢复——改成 abort 会把单线程 panic 变成
# 整进程退出，属用户可见行为变化，收益（省下展开表）也多被 strip
# 覆盖，故不启用。
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "s"
